name: Generate EMICOOL OCI health report
run-name: >-
  ${{ inputs.scheduled_delivery
  && 'EMICOOL daily 07:00 delivery'
  || 'Generate EMICOOL OCI health report' }}

on:
  # Primary trigger: an external scheduler calls the workflow_dispatch API
  # at 07:00 Africa/Cairo with scheduled_delivery=true (see README.md); the
  # report is emailed as soon as it has been generated.
  # Dispatched runs start within seconds, unlike GitHub's own cron, which
  # has been starting this workflow 4-6 hours late.
  workflow_dispatch:
    inputs:
      scheduled_delivery:
        description: "Daily 07:00 delivery: email the report once generated"
        type: boolean
        default: false
      send_email:
        description: "Email the report as soon as it is generated"
        type: boolean
        default: false
  schedule:
    # Backup only: sends the report if today's dispatched 07:00 delivery
    # did not succeed. It is scheduled well after 07:00 so it never races
    # the daily delivery, and off the top of the hour, when GitHub delays
    # fewer scheduled runs. GitHub cron is UTC-only and Cairo observes DST
    # (UTC+3 in summer, UTC+2 in winter), so both candidate times are
    # scheduled and the cairo-window job keeps only the one that matches
    # today's offset. GitHub schedules run from the default branch.
    - cron: "17 6 * * *" # 09:17 Cairo during summer time (UTC+3)
    - cron: "17 7 * * *" # 09:17 Cairo during winter time (UTC+2)

permissions:
  contents: read

jobs:
  cairo-window:
    name: Check Cairo schedule window
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Match schedule to Cairo UTC offset
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "schedule" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The scheduled time (not the actual start time) is compared,
          # so GitHub's queueing delays never cause a skipped day.
          cairo_offset="$(TZ=Africa/Cairo date +%z)"
          case "${cairo_offset}" in
            +0300) expected_schedule="17 6 * * *" ;;
            +0200) expected_schedule="17 7 * * *" ;;
            *)
              echo "::error::Unexpected Africa/Cairo offset ${cairo_offset}."
              exit 1
              ;;
          esac

          if [[ "${EVENT_SCHEDULE}" != "${expected_schedule}" ]]; then
            echo "Skipping: '${EVENT_SCHEDULE}' is not 09:17 Cairo today (offset ${cairo_offset})."
            echo "run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip the backup when today's 07:00 delivery already succeeded
          # or is still running, so the report is never emailed twice.
          cairo_midnight="$(TZ=Africa/Cairo date -d 'today 00:00' +%s)"
          delivered_today="$(
            gh run list \
              --workflow emicool-health-report.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json displayTitle,status,conclusion,createdAt \
            | jq --argjson since "${cairo_midnight}" '[
                .[]
                | select(.displayTitle == "EMICOOL daily 07:00 delivery")
                | select((.createdAt | fromdateiso8601) >= $since)
                | select(.status != "completed" or .conclusion == "success")
              ] | length'
          )"

          if (( delivered_today > 0 )); then
            echo "Skipping backup: today's 07:00 delivery already ran."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::No 07:00 delivery found today; sending backup report."
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

  generate-report:
    name: Generate EMICOOL report
    needs: cairo-window
    if: needs.cairo-window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level so the lightweight cairo-window checks are never queued
    # (and cancelled while pending) behind a running report.
    concurrency:
      group: emicool-oci-health-report
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Configure OCI API-key authentication
        shell: bash
        env:
          OCI_TENANCY: ${{ secrets.OCI_EMICOOL_TENANCY_OCID }}
          OCI_USER: ${{ secrets.OCI_EMICOOL_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_EMICOOL_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_EMICOOL_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_EMICOOL_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_EMICOOL_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          for required_secret in OCI_TENANCY OCI_USER OCI_FINGERPRINT OCI_REGION OCI_PRIVATE_KEY; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "::error title=Missing GitHub secret::${required_secret} is required. See README.md for setup."
              exit 1
            fi
          done

          oci_directory="${RUNNER_TEMP}/emicool-oci"
          oci_key_file="${oci_directory}/api_key.pem"
          oci_config_file="${oci_directory}/config"
          umask 077
          mkdir -p "${oci_directory}"
          printf '%s\n' "${OCI_PRIVATE_KEY}" > "${oci_key_file}"
          {
            printf '[EMICOOL]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
              "${OCI_USER}" \
              "${OCI_FINGERPRINT}" \
              "${OCI_TENANCY}" \
              "${OCI_REGION}" \
              "${oci_key_file}"
            if [[ -n "${OCI_PRIVATE_KEY_PASSPHRASE:-}" ]]; then
              printf 'pass_phrase=%s\n' "${OCI_PRIVATE_KEY_PASSPHRASE}"
            fi
          } > "${oci_config_file}"

          echo "OCI_CONFIG_FILE=${oci_config_file}" >> "${GITHUB_ENV}"
          echo "OCI_CONFIG_DIRECTORY=${oci_directory}" >> "${GITHUB_ENV}"

      - name: Generate EMICOOL health report
        run: |
          mkdir -p reports
          python oci_health_check.py \
            --profile EMICOOL \
            --customer-name "EMICOOL" \
            --config-file "${OCI_CONFIG_FILE}" \
            --output reports

      - name: Remove OCI credentials from runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${OCI_CONFIG_DIRECTORY:-}" ]]; then
            rm -rf "${OCI_CONFIG_DIRECTORY}"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emicool-oci-health-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Email report to Ziad
        if: >-
          success()
          && (github.event_name == 'schedule'
          || inputs.scheduled_delivery
          || inputs.send_email)
        env:
          REPORT_TEST_RECIPIENT: Ziad.Abdelrazek@zaintech.com
          REPORT_SENDER: ziad.cee@gmail.com
          SMTP_HOST: ${{ secrets.EMICOOL_REPORT_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.EMICOOL_REPORT_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.EMICOOL_REPORT_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.EMICOOL_REPORT_SMTP_PASSWORD }}
        run: python scripts/send_report_email.py
